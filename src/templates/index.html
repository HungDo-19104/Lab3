<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Chatbot vs Travel Agent Demo</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <main class="page">
        <section class="hero">
            <div class="hero-copy">
                <p class="eyebrow">Travel Demo</p>
                <h1>Travel Chatbot vs Travel Agent Demo</h1>
                <p class="subtitle">
                    So sánh trực tiếp một chatbot trả lời chung chung với một ReAct Agent có dùng tool cho travel planning.
                </p>
            </div>
            <div class="hero-panel">
                <form id="planner-form" class="planner-form">
                    <label>
                        <span>Destination</span>
                        <input name="destination" value="{{ defaults.destination }}" required>
                    </label>
                    <label>
                        <span>Date</span>
                        <input type="date" name="date" value="{{ defaults.date }}" required>
                    </label>
                    <label>
                        <span>Preference</span>
                        <input name="preference" value="{{ defaults.preference }}" placeholder="thiên nhiên, văn hóa, ăn uống...">
                    </label>
                    <label>
                        <span>Days</span>
                        <input type="number" name="days" value="{{ defaults.days }}" min="1" required>
                    </label>
                    <label>
                        <span>Budget</span>
                        <input type="number" name="budget" value="{{ defaults.budget }}" min="0" required>
                    </label>
                    <label>
                        <span>Travel Style</span>
                        <select name="travel_style">
                            <option value="budget" {% if defaults.travel_style == "budget" %}selected{% endif %}>budget</option>
                            <option value="standard" {% if defaults.travel_style == "standard" %}selected{% endif %}>standard</option>
                            <option value="premium" {% if defaults.travel_style == "premium" %}selected{% endif %}>premium</option>
                        </select>
                    </label>
                    <button type="submit">Compare Chatbot vs Agent</button>
                </form>
            </div>
        </section>

        <section class="results">
            <div class="results-header">
                <h2>Comparison Result</h2>
                <p id="status">Nhập thông tin chuyến đi rồi bấm Compare Chatbot vs Agent.</p>
            </div>

            <section id="comparison-section" class="hidden">
                <h3>Comparison Table</h3>
                <div class="table-wrap">
                    <table id="comparison-table" class="comparison-table">
                        <thead>
                            <tr>
                                <th>Tiêu chí</th>
                                <th>Chatbot</th>
                                <th>Agent</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>

            <div class="outputs">
                <article id="chatbot-output" class="final-answer hidden"></article>
                <article id="agent-output" class="final-answer hidden"></article>
            </div>

            <section id="trace-section" class="hidden">
                <h3>Agent ReAct Trace</h3>
                <div id="trace" class="trace"></div>
            </section>
        </section>
    </main>

    <script>
        const form = document.getElementById("planner-form");
        const statusEl = document.getElementById("status");
        const comparisonSection = document.getElementById("comparison-section");
        const comparisonTableBody = document.querySelector("#comparison-table tbody");
        const chatbotOutputEl = document.getElementById("chatbot-output");
        const agentOutputEl = document.getElementById("agent-output");
        const traceSection = document.getElementById("trace-section");
        const traceEl = document.getElementById("trace");

        const currency = (value) => new Intl.NumberFormat("vi-VN").format(value) + "đ";

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            statusEl.textContent = "Đang so sánh Chatbot và Agent...";
            comparisonSection.classList.add("hidden");
            chatbotOutputEl.classList.add("hidden");
            agentOutputEl.classList.add("hidden");
            traceSection.classList.add("hidden");
            comparisonTableBody.innerHTML = "";
            traceEl.innerHTML = "";

            const formData = new FormData(form);
            const payload = {
                destination: formData.get("destination"),
                date: formData.get("date"),
                preference: formData.get("preference"),
                days: Number(formData.get("days")),
                budget: Number(formData.get("budget")),
                travel_style: formData.get("travel_style"),
            };

            try {
                const response = await fetch("/compare", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.detail || "Request failed");
                }

                statusEl.textContent = "Đã so sánh xong Chatbot và Agent.";
                comparisonSection.classList.remove("hidden");
                chatbotOutputEl.classList.remove("hidden");
                agentOutputEl.classList.remove("hidden");
                traceSection.classList.remove("hidden");

                comparisonTableBody.innerHTML = data.comparison.map((row) => `
                    <tr>
                        <td>${row.criteria}</td>
                        <td>${row.chatbot}</td>
                        <td>${row.agent}</td>
                    </tr>
                `).join("");

                chatbotOutputEl.innerHTML = `
                    <h3>Chatbot Output</h3>
                    <p><strong>Method:</strong> ${data.chatbot.method}</p>
                    <p>${data.chatbot.final_answer}</p>
                `;

                agentOutputEl.innerHTML = `
                    <h3>Agent Output</h3>
                    <p><strong>Total Cost:</strong> ${currency(data.agent.total_cost)}</p>
                    <p><strong>Budget Check:</strong> ${data.agent.within_budget ? "Trong ngân sách" : "Vượt ngân sách"}</p>
                    <p>${data.agent.final_answer}</p>
                    <h3>Cost Breakdown</h3>
                    <pre>${JSON.stringify(data.agent.cost_breakdown, null, 2)}</pre>
                    <h3>Travel Advice</h3>
                    <p>${data.agent.travel_advice}</p>
                `;

                traceEl.innerHTML = data.agent.trace.map((step, index) => `
                    <article class="trace-card">
                        <h4>Step ${index + 1}</h4>
                        <p class="trace-label">Thought</p>
                        <p>${step.thought}</p>
                        <p class="trace-label">Action</p>
                        <code>${step.action}</code>
                        <p class="trace-label">Observation</p>
                        <pre>${JSON.stringify(step.observation, null, 2)}</pre>
                    </article>
                `).join("");
            } catch (error) {
                statusEl.textContent = "Không thể tạo bảng so sánh.";
                chatbotOutputEl.classList.remove("hidden");
                chatbotOutputEl.innerHTML = `<h3>Error</h3><p>${error.message}</p>`;
            }
        });
    </script>
</body>
</html>
